version: 2
updates:
  # Track npm dependencies (Svelte, Vite, Typescript, etc.)
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Track cargo dependencies (Rust backend crates)
  - package-ecosystem: cargo
    directory: '/src-tauri'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
